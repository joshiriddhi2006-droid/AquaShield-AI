<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Real-Time GIS Safe Route - AquaShield</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" href="gis-style.css" />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css"
    />

    <style>
      .gis-container {
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 1rem;
        height: calc(100vh - 90px);
        margin-top: 10px;
      }

      .gis-sidebar {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
        overflow-y: auto;
      }

      #realGisMap {
        width: 100%;
        height: 100%;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        z-index: 1;
      }

      .route-info-box {
        background: var(--bg-main);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 10px;
        font-size: 0.85rem;
      }

      .search-box-group {
        display: flex;
        gap: 6px;
      }

      .search-input {
        flex: 1;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid var(--border-color);
        background: var(--bg-main);
        color: var(--text-primary);
        font-size: 0.85rem;
      }

      .leaflet-routing-container {
        font-size: 0.8rem !important;
        max-height: 200px;
        overflow-y: auto;
        border-radius: 8px !important;
      }

      @media (max-width: 768px) {
        .gis-container {
          grid-template-columns: 1fr;
          height: auto;
        }

        #realGisMap {
          height: 450px;
        }
      }
    </style>
  </head>

  <body class="light-theme">
    <!-- NAVBAR -->

    <nav class="navbar">
      <div class="nav-brand">
        <i class="fa-solid fa-route logo-icon" style="color: #0284c7"></i>

        <div>
          <h1>AquaShield GIS</h1>

          <span> Flood Safe Route & Navigation </span>
        </div>
      </div>

      <div class="nav-links">
        <a
          href="https://aquashield-citizen.onrender.com/index.html"
          class="nav-item"
        >
          <i class="fa-solid fa-house"></i>

          Home
        </a>

        <a
          href="https://aquashield-citizen.onrender.com/"
          class="btn btn-red"
          style="padding: 4px 10px; font-size: 0.8rem; text-decoration: none"
        >
          Logout
        </a>

        <button
          id="gisThemeBtn"
          class="theme-btn"
          type="button"
          onclick="gisToggleTheme()"
          title="Toggle Light / Dark Mode"
        >
          <i id="themeIcon" class="fa-solid fa-moon"></i>
        </button>
      </div>
    </nav>

    <!-- MAIN -->

    <main class="container" style="max-width: 100%; padding: 0 1rem">
      <div class="gis-container">
        <!-- SIDEBAR -->

        <aside class="gis-sidebar">
          <h3 style="margin: 0; font-size: 1.1rem; color: var(--text-primary)">
            <i class="fa-solid fa-sliders"></i>

            Safe Route Navigation
          </h3>

          <!-- GPS -->

          <button
            class="btn btn-blue"
            style="width: 100%; font-weight: bold"
            onclick="locateUserOnMap()"
          >
            <i class="fa-solid fa-crosshairs"></i>

            Get My GPS Location
          </button>

          <!-- DESTINATION -->

          <div>
            <label
              style="
                font-size: 0.85rem;
                font-weight: bold;
                color: var(--text-primary);
                display: block;
                margin-bottom: 4px;
              "
            >
              <i class="fa-solid fa-magnifying-glass-location"></i>

              Enter Destination Area:
            </label>

            <div class="search-box-group">
              <input
                type="text"
                id="destInput"
                class="search-input"
                placeholder="e.g. Vijay Nagar, Palasia..."
                onkeypress="if (event.key === 'Enter') searchDestination();"
              />

              <button
                class="btn btn-green"
                style="padding: 8px 12px"
                onclick="searchDestination()"
              >
                <i class="fa-solid fa-paper-plane"></i>
              </button>
            </div>
          </div>

          <!-- VEHICLE -->

          <div>
            <label
              style="
                font-size: 0.85rem;
                font-weight: bold;
                color: var(--text-primary);
                display: block;
                margin-bottom: 4px;
              "
            >
              <i class="fa-solid fa-car"></i>

              Select Vehicle Type:
            </label>

            <select
              id="vehicleType"
              class="search-input"
              style="width: 100%"
              onchange="onVehicleChange()"
            >
              <option value="2wheeler">🛵 2-Wheeler (Bike / Scooter)</option>

              <option value="sedan" selected>🚗 Sedan / Hatchback Car</option>

              <option value="suv">🛻 SUV / Heavy Clearance</option>

              <option value="emergency">🚒 Emergency / Rescue Truck</option>
            </select>
          </div>

          <!-- TRIP SUMMARY -->

          <div class="route-info-box">
            <h4 style="margin: 0 0 6px 0; color: var(--text-primary)">
              <i class="fa-solid fa-map-pin"></i>

              Trip Summary
            </h4>

            <div
              id="destNameTxt"
              style="
                font-size: 0.82rem;
                color: var(--text-secondary);
                margin-bottom: 2px;
              "
            >
              Destination: Not Set
            </div>

            <div
              id="distanceTxt"
              style="font-weight: bold; color: #0284c7; margin-bottom: 6px"
            >
              Distance: -- km
            </div>

            <div
              id="safetyAdvice"
              style="
                font-size: 0.8rem;
                color: var(--text-secondary);
                margin-bottom: 8px;
              "
            >
              Type an area name above to calculate safe route.
            </div>

            <button
              class="btn btn-green"
              style="width: 100%; font-weight: bold; font-size: 0.82rem"
              onclick="openGoogleMapsLive()"
            >
              <i class="fa-solid fa-location-arrow"></i>

              Open in Google Maps
            </button>
          </div>

          <!-- MAP STYLE -->

          <div style="margin-top: auto">
            <h4
              style="
                margin: 0 0 6px 0;
                font-size: 0.85rem;
                color: var(--text-primary);
              "
            >
              Map Base View
            </h4>

            <label style="font-size: 0.8rem; cursor: pointer">
              <input
                type="radio"
                name="mapTile"
                value="street"
                checked
                onchange="switchMapStyle('street')"
              />

              Standard Map
            </label>

            <label
              style="font-size: 0.8rem; cursor: pointer; margin-left: 10px"
            >
              <input
                type="radio"
                name="mapTile"
                value="satellite"
                onchange="switchMapStyle('satellite')"
              />

              Satellite
            </label>
          </div>
        </aside>

        <!-- MAP -->

        <section style="position: relative">
          <div id="realGisMap"></div>
        </section>
      </div>
    </main>

    <!-- LEAFLET -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <!-- YOUR EXISTING GIS APP -->

    <script src="app.js"></script>

    <script>
      let map;

      let streetTile;

      let satelliteTile;

      let startMarker;

      let destMarker;

      let routingControl;

      let startCoords = [22.7196, 75.8577];

      let destCoords = null;

      /* =====================================================
         INITIALIZE MAP
      ===================================================== */

      document.addEventListener("DOMContentLoaded", function () {
        map = L.map("realGisMap").setView(startCoords, 13);

        streetTile = L.tileLayer(
          "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
          {
            maxZoom: 19,
          },
        ).addTo(map);

        satelliteTile = L.tileLayer(
          "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
          {
            maxZoom: 18,
          },
        );

        startMarker = L.marker(startCoords)
          .addTo(map)
          .bindPopup("<b>📍 Start Point</b>")
          .openPopup();

        L.circle([22.722, 75.86], {
          color: "#e11d48",
          fillColor: "#f43f5e",
          fillOpacity: 0.4,
          radius: 400,
        })
          .addTo(map)
          .bindPopup(
            "<b>⚠️ High Flood Risk Zone</b><br>Expected Depth: 2.5 Feet",
          );

        if (typeof loadComplaintsOnMap === "function") {
          loadComplaintsOnMap();
        }
      });

      /* =====================================================
         SEARCH DESTINATION
      ===================================================== */

      async function searchDestination() {
        const query = document.getElementById("destInput").value.trim();

        if (!query) {
          alert("Please enter a location or area name!");

          return;
        }

        const adviceBox = document.getElementById("safetyAdvice");

        adviceBox.innerHTML =
          "⏳ <span style='color:#0284c7;'>Locating area & calculating safe route...</span>";

        try {
          const response = await fetch(
            `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`,
          );

          const data = await response.json();

          if (!data || data.length === 0) {
            adviceBox.innerHTML = "❌ Location not found. Try another area.";

            return;
          }

          destCoords = [parseFloat(data[0].lat), parseFloat(data[0].lon)];

          document.getElementById("destNameTxt").innerText =
            "Destination: " + data[0].display_name;

          if (destMarker) {
            map.removeLayer(destMarker);
          }

          destMarker = L.marker(destCoords)
            .addTo(map)
            .bindPopup("<b>📍 Destination</b>")
            .openPopup();

          calculateRoute();
        } catch (error) {
          console.error(error);

          adviceBox.innerHTML = "❌ Unable to locate destination.";
        }
      }

      /* =====================================================
         ROUTE
      ===================================================== */

      function calculateRoute() {
        if (!destCoords) {
          return;
        }

        if (routingControl) {
          map.removeControl(routingControl);
        }

        routingControl = L.Routing.control({
          waypoints: [
            L.latLng(startCoords[0], startCoords[1]),

            L.latLng(destCoords[0], destCoords[1]),
          ],

          routeWhileDragging: false,

          showAlternatives: true,

          addWaypoints: false,

          lineOptions: {
            styles: [
              {
                color: "#0284c7",
                opacity: 0.85,
                weight: 6,
              },
            ],
          },

          createMarker: function () {
            return null;
          },
        })

          .on("routesfound", function (e) {
            const route = e.routes[0];

            const distance = (route.summary.totalDistance / 1000).toFixed(2);

            document.getElementById("distanceTxt").innerText =
              "Distance: " + distance + " km";

            document.getElementById("safetyAdvice").innerHTML =
              "✅ Route calculated. Stay alert for waterlogged areas and follow safety instructions.";
          })

          .addTo(map);
      }

      /* =====================================================
         GPS
      ===================================================== */

      function locateUserOnMap() {
        if (!navigator.geolocation) {
          alert("GPS is not supported by your browser.");

          return;
        }

        navigator.geolocation.getCurrentPosition(
          function (position) {
            startCoords = [position.coords.latitude, position.coords.longitude];

            map.setView(startCoords, 15);

            if (startMarker) {
              map.removeLayer(startMarker);
            }

            startMarker = L.marker(startCoords)
              .addTo(map)
              .bindPopup("<b>📍 Your Current Location</b>")
              .openPopup();

            if (destCoords) {
              calculateRoute();
            }
          },

          function () {
            alert("Unable to get your current location.");
          },

          {
            enableHighAccuracy: true,

            timeout: 10000,
          },
        );
      }

      /* =====================================================
         VEHICLE TYPE
      ===================================================== */

      function onVehicleChange() {
        const vehicle = document.getElementById("vehicleType").value;

        const advice = document.getElementById("safetyAdvice");

        if (vehicle === "2wheeler") {
          advice.innerText = "🛵 2-Wheeler selected. Avoid deep-water areas.";
        } else if (vehicle === "suv") {
          advice.innerText =
            "🛻 SUV selected. Higher clearance may help in moderate waterlogging.";
        } else if (vehicle === "emergency") {
          advice.innerText =
            "🚒 Emergency vehicle selected. Prefer accessible major roads.";
        } else {
          advice.innerText = "🚗 Car selected. Avoid known flood-risk zones.";
        }
      }

      /* =====================================================
         MAP STYLE
      ===================================================== */

      function switchMapStyle(style) {
        if (style === "satellite") {
          if (map.hasLayer(streetTile)) {
            map.removeLayer(streetTile);
          }

          if (!map.hasLayer(satelliteTile)) {
            satelliteTile.addTo(map);
          }
        } else {
          if (map.hasLayer(satelliteTile)) {
            map.removeLayer(satelliteTile);
          }

          if (!map.hasLayer(streetTile)) {
            streetTile.addTo(map);
          }
        }
      }

      /* =====================================================
         GOOGLE MAPS
      ===================================================== */

      function openGoogleMapsLive() {
        if (!destCoords) {
          alert("Please select a destination first.");

          return;
        }

        const url = `https://www.google.com/maps/dir/?api=1&destination=${destCoords[0]},${destCoords[1]}`;

        window.open(url, "_blank");
      }

      /* =====================================================
         GIS THEME
      ===================================================== */

      function applyGisTheme(theme) {
        const body = document.body;

        const icon = document.getElementById("themeIcon");

        if (theme === "dark") {
          body.classList.remove("light-theme");

          body.classList.add("dark-theme");

          document.documentElement.classList.add("dark");

          localStorage.setItem("gis-theme", "dark");

          if (icon) {
            icon.className = "fa-solid fa-sun";
          }
        } else {
          body.classList.remove("dark-theme");

          body.classList.add("light-theme");

          document.documentElement.classList.remove("dark");

          localStorage.setItem("gis-theme", "light");

          if (icon) {
            icon.className = "fa-solid fa-moon";
          }
        }
      }

      function gisToggleTheme() {
        const isDark = document.body.classList.contains("dark-theme");

        applyGisTheme(isDark ? "light" : "dark");
      }

      /* =====================================================
         RESTORE GIS THEME
      ===================================================== */

      document.addEventListener("DOMContentLoaded", function () {
        const savedTheme = localStorage.getItem("gis-theme");

        if (savedTheme === "dark") {
          applyGisTheme("dark");
        } else {
          applyGisTheme("light");
        }
      });
    </script>
  </body>
</html>
